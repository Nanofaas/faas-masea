[project]
name = "faas-masea"
version = "0.1.0"
description = "Multi-agent auction algorithms for edge-cloud FaaS orchestration"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "AGPL-3.0-only"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.1", "scipy==1.14.1", "networkx==3.4.2",
  "matplotlib==3.10.3", "pyomo==6.9.2", "highspy>=1.15.1",
  "parse==1.20.2", "pyyaml>=6.0.2", "rich>=13,<15",
]
[project.optional-dependencies]
cuda = ["numba-cuda", "cuda-python"]
gurobi = ["gurobipy==12.0.3"]
[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]
